# Базы данных для уроков 16–18 и проектов.
# Запуск:   docker compose up -d --wait
# Стоп:     docker compose down        (с удалением данных: down -v)
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: course
      POSTGRES_PASSWORD: course
      POSTGRES_DB: course
    ports: ["55432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U course -d course"]
      interval: 2s
      retries: 30

  redis:
    image: redis:7.4
    ports: ["56379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 30

  clickhouse:
    image: clickhouse/clickhouse-server:25.3
    environment:
      CLICKHOUSE_USER: course
      CLICKHOUSE_PASSWORD: course
      CLICKHOUSE_DB: course
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports: ["58123:8123"]
    ulimits:
      nofile: {soft: 262144, hard: 262144}
    healthcheck:
      test: ["CMD", "clickhouse-client", "--user", "course", "--password", "course", "-q", "SELECT 1"]
      interval: 2s
      retries: 60
