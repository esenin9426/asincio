[project]
name = "asyncio-course"
version = "0.1.0"
description = "Пошаговый курс по asyncio: уроки, задачи, тесты и проекты"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
    "aiohttp>=3.14.5",
    "asyncpg>=0.32.0",
    "clickhouse-connect>=1.10.1",
    "pytest>=8",
    "redis>=5",
]

[tool.pytest.ini_options]
testpaths = ["lessons", "projects"]
pythonpath = ["."]
addopts = "-ra"
